name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Discover testbench packages
        # Larastan validates view-string arguments against a booted testbench
        # app; without package discovery the glider:: view namespace is
        # unknown and every view() call is flagged.
        run: composer run prepare

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=1G
